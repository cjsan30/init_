name: Deploy AWS Main

# 개인 fork(cjsan30/init_)에서는 팀 AWS 계정과 배포 secret이 없으므로 자동 배포를 끈다.
# 원본 팀 레포(seok3m4/init)에서는 dev/main push 시 배포되던 workflow이다.
on:
  workflow_dispatch:

concurrency:
  group: aws-main-deploy
  cancel-in-progress: false
  queue: max

jobs:
  detect:
    name: Detect Deploy Scope
    if: github.repository == 'seok3m4/init' && github.event.created != true && github.event.deleted != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy_required: ${{ steps.scope.outputs.deploy_required }}
      deploy_sha: ${{ steps.scope.outputs.deploy_sha }}
      frontend: ${{ steps.scope.outputs.frontend }}
      api: ${{ steps.scope.outputs.api }}
      worker: ${{ steps.scope.outputs.worker }}
      migration: ${{ steps.scope.outputs.migration }}
      terraform_changed: ${{ steps.scope.outputs.terraform_changed }}
    steps:
      - name: Detect changed service groups
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const deploySha = context.sha;
            const baseBranch = context.ref.replace("refs/heads/", "");
            const sortByMergedAtDesc = (left, right) =>
              new Date(right.pull.merged_at) - new Date(left.pull.merged_at);
            const isMergedIntoBase = ({ pull }) =>
              Boolean(pull.merged_at) && pull.base.ref === baseBranch;
            const uniqueByPullNumber = (entries) => {
              const seen = new Set();
              return entries.filter(({ pull }) => {
                if (seen.has(pull.number)) {
                  return false;
                }
                seen.add(pull.number);
                return true;
              });
            };

            const associatedPulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner,
                repo,
                commit_sha: deploySha,
                per_page: 100
              }
            );
            const associatedEntries = associatedPulls.map((pull) => ({
              pull,
              source: "commit association"
            }));

            const closedPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "closed",
              base: baseBranch,
              sort: "updated",
              direction: "desc",
              per_page: 100
            });
            const mergeCommitEntries = closedPulls
              .filter((pull) => pull.merge_commit_sha === deploySha)
              .map((pull) => ({
                pull,
                source: "merge_commit_sha"
              }));

            const mergedPullEntries = uniqueByPullNumber([...associatedEntries, ...mergeCommitEntries])
              .filter(isMergedIntoBase)
              .sort(sortByMergedAtDesc);

            if (mergedPullEntries.length === 0) {
              core.setFailed(
                `No merged PR associated with ${deploySha} on ${baseBranch}. Checked commit associations and merged PR merge_commit_sha values. Direct push deployment is blocked.`
              );
              return;
            }

            const { pull: pullRequest, source: pullRequestSource } = mergedPullEntries[0];
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullRequest.number,
              per_page: 100
            });

            const changedPaths = files.map((file) => file.filename);
            const startsWithAny = (prefixes) =>
              changedPaths.some((path) => prefixes.some((prefix) => path.startsWith(prefix)));
            const includesAny = (paths) =>
              changedPaths.some((path) => paths.includes(path));

            const deployWorkflowChanged = includesAny([".github/workflows/deploy.yml"]);
            const frontend =
              deployWorkflowChanged ||
              startsWithAny(["frontend/"]) ||
              includesAny(["infra/docker/frontend.Dockerfile"]);
            const api =
              deployWorkflowChanged ||
              startsWithAny(["backend/api/", "backend/common/"]) ||
              includesAny(["infra/docker/api.Dockerfile"]);
            const worker =
              deployWorkflowChanged ||
              startsWithAny(["backend/worker/", "backend/common/", "backend/api/prisma/"]) ||
              includesAny(["infra/docker/worker.Dockerfile"]);
            const migration = api;
            const terraformChanged = changedPaths.some((path) =>
              /^infra\/aws\/[^/]+\.tf$/.test(path) ||
              /^infra\/aws\/bootstrap\/[^/]+\.tf$/.test(path) ||
              path.startsWith("infra/aws/env/")
            );
            const deployRequired = frontend || api || worker;
            const outputs = {
              deploy_required: deployRequired,
              deploy_sha: deploySha,
              frontend,
              api,
              worker,
              migration,
              terraform_changed: terraformChanged
            };

            for (const [key, value] of Object.entries(outputs)) {
              core.setOutput(key, String(value));
            }

            core.info(`Base branch: ${baseBranch}`);
            core.info(`Associated merged PR: #${pullRequest.number} via ${pullRequestSource}`);
            core.info(`Changed files: ${changedPaths.join(", ") || "(none)"}`);
            core.info(`Deploy SHA: ${deploySha}`);
            core.info(`Deploy scope: ${JSON.stringify(outputs)}`);

  deploy:
    name: Deploy to init-main
    needs: detect
    if: needs.detect.outputs.deploy_required == 'true'
    runs-on: ubuntu-latest
    environment:
      name: init-main
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      NEXT_PUBLIC_AI_INTERVIEWER_SESSION_MODE: ${{ vars.NEXT_PUBLIC_AI_INTERVIEWER_SESSION_MODE }}
      NEXT_PUBLIC_AI_INTERVIEWER_REALTIME_ENABLED: ${{ vars.NEXT_PUBLIC_AI_INTERVIEWER_REALTIME_ENABLED }}
      NEXT_PUBLIC_AI_INTERVIEWER_AVATAR_STREAM_ENABLED: ${{ vars.NEXT_PUBLIC_AI_INTERVIEWER_AVATAR_STREAM_ENABLED }}
      NEXT_PUBLIC_OPENAI_REALTIME_STT_RELAY_ENABLED: ${{ vars.NEXT_PUBLIC_OPENAI_REALTIME_STT_RELAY_ENABLED }}
      NEXT_PUBLIC_NCS_QUESTION_POLICY_ENABLED: ${{ vars.NEXT_PUBLIC_NCS_QUESTION_POLICY_ENABLED }}
      NEXT_PUBLIC_TOSS_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_TOSS_CLIENT_KEY }}
      # 카카오맵 JavaScript 키(선택). 미설정 시 지원자 공고 상세 지도만 비활성, 배포는 정상.
      NEXT_PUBLIC_KAKAO_MAP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_KEY }}
      # 운영 SMTP 계정이 준비된 경우에만 true로 설정한다. 미설정/false면 SMTP smoke는 배포 gate에서 제외한다.
      SMTP_DEPLOY_SMOKE_ENABLED: ${{ vars.SMTP_DEPLOY_SMOKE_ENABLED }}
      IMAGE_TAG: ${{ needs.detect.outputs.deploy_sha }}
      CLUSTER_NAME: init-main
    steps:
      - name: Validate deploy inputs
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ needs.detect.outputs.terraform_changed }}" = "true" ]; then
            echo "::warning::This merged PR changes Terraform files and application deploy inputs together. Application deployment will continue, but Terraform must still be planned and applied separately."
          fi

          missing=0
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN APP_BASE_URL \
            NEXT_PUBLIC_AI_INTERVIEWER_SESSION_MODE \
            NEXT_PUBLIC_AI_INTERVIEWER_REALTIME_ENABLED \
            NEXT_PUBLIC_AI_INTERVIEWER_AVATAR_STREAM_ENABLED \
            NEXT_PUBLIC_OPENAI_REALTIME_STT_RELAY_ENABLED \
            NEXT_PUBLIC_NCS_QUESTION_POLICY_ENABLED \
            NEXT_PUBLIC_TOSS_CLIENT_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in the init-main GitHub Environment."
              missing=1
            fi
          done

          case "${SMTP_DEPLOY_SMOKE_ENABLED:-false}" in
            true|false) ;;
            *)
              echo "::error::SMTP_DEPLOY_SMOKE_ENABLED must be true or false when configured."
              missing=1
              ;;
          esac

          if [ "${{ needs.detect.outputs.api }}" = "true" ] && [ "${SMTP_DEPLOY_SMOKE_ENABLED:-false}" != "true" ]; then
            echo "::notice::SMTP deploy smoke is disabled; email delivery is not validated by this deployment."
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.deploy_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: init-main-deploy-${{ github.run_id }}

      - name: Resolve AWS targets
        id: aws
        shell: bash
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="$account_id.dkr.ecr.$AWS_REGION.amazonaws.com"

          {
            echo "account_id=$account_id"
            echo "registry=$registry"
            echo "frontend_image=$registry/init-main-frontend:$IMAGE_TAG"
            echo "api_image=$registry/init-main-api:$IMAGE_TAG"
            echo "worker_image=$registry/init-main-worker:$IMAGE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Validate runtime secret keys
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const locals = fs.readFileSync("infra/aws/locals.tf", "utf8");
          const services = {
            frontend: "init/main/frontend",
            api: "init/main/api",
            worker: "init/main/worker"
          };
          const forbiddenKeys = new Set([
            "AWS_ACCESS_KEY_ID",
            "AWS_SECRET_ACCESS_KEY",
            "AWS_ENDPOINT_URL"
          ]);
          // Temporary release exception while external provider accounts are disabled.
          // Keep this allowlist narrow and remove entries as credentials are restored.
          const temporarilyAllowedPlaceholderKeys = {
            frontend: new Set(),
            api: new Set([
              "GOOGLE_CLIENT_ID",
              "GOOGLE_CLIENT_SECRET",
              "SMTP_USER",
              "SMTP_PASS",
              "OPENAI_API_KEY",
              "AI_PROVIDER_API_KEY"
            ]),
            worker: new Set([
              "OPENAI_API_KEY",
              "AI_PROVIDER_API_KEY"
            ])
          };

          function expectedKeysFor(service) {
            const marker = `${service} = [`;
            const start = locals.indexOf(marker);
            if (start === -1) {
              throw new Error(`secret_keys.${service} block not found`);
            }

            const end = locals.indexOf("]", start);
            if (end === -1) {
              throw new Error(`secret_keys.${service} block is not closed`);
            }

            return [...locals.slice(start, end).matchAll(/"([^"]+)"/g)].map((match) => match[1]);
          }

          let failed = false;
          for (const [service, secretId] of Object.entries(services)) {
            const expected = expectedKeysFor(service);
            const secretString = execFileSync(
              "aws",
              [
                "secretsmanager",
                "get-secret-value",
                "--secret-id",
                secretId,
                "--query",
                "SecretString",
                "--output",
                "text"
              ],
              { encoding: "utf8" }
            ).trim();
            const actual = JSON.parse(secretString);
            const actualKeys = Object.keys(actual);
            const missing = expected.filter((key) => !Object.prototype.hasOwnProperty.call(actual, key));
            const empty = expected.filter((key) => String(actual[key] ?? "").trim() === "");
            const placeholder = expected.filter((key) => /^<[^>]+>$/.test(String(actual[key] ?? "").trim()));
            const allowedPlaceholder = placeholder.filter((key) =>
              temporarilyAllowedPlaceholderKeys[service].has(key)
            );
            const blockedPlaceholder = placeholder.filter((key) =>
              !temporarilyAllowedPlaceholderKeys[service].has(key)
            );
            const forbidden = actualKeys.filter((key) => forbiddenKeys.has(key));

            console.log(`${service}: expected ${expected.length}, actual ${actualKeys.length}`);
            if (allowedPlaceholder.length) {
              console.warn(
                `::warning::${service}: temporarily allowed placeholder keys: ${allowedPlaceholder.join(",")}. Provider-backed features remain unavailable.`
              );
            }

            if (missing.length || empty.length || blockedPlaceholder.length || forbidden.length) {
              failed = true;
              if (missing.length) console.error(`${service}: missing keys: ${missing.join(",")}`);
              if (empty.length) console.error(`${service}: empty keys: ${empty.join(",")}`);
              if (blockedPlaceholder.length) {
                console.error(`${service}: blocked placeholder keys: ${blockedPlaceholder.join(",")}`);
              }
              if (forbidden.length) console.error(`${service}: forbidden local AWS override keys: ${forbidden.join(",")}`);
            }
          }

          if (failed) {
            process.exit(1);
          }
          NODE

      - name: Log in to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "${{ steps.aws.outputs.registry }}"

      - name: Build and push frontend image
        if: needs.detect.outputs.frontend == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if aws ecr describe-images --repository-name init-main-frontend --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "frontend image $IMAGE_TAG already exists; skipping build and push"
            exit 0
          fi

          docker build \
            -f infra/docker/frontend.Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$APP_BASE_URL" \
            --build-arg NEXT_PUBLIC_AI_INTERVIEWER_SESSION_MODE="$NEXT_PUBLIC_AI_INTERVIEWER_SESSION_MODE" \
            --build-arg NEXT_PUBLIC_AI_INTERVIEWER_REALTIME_ENABLED="$NEXT_PUBLIC_AI_INTERVIEWER_REALTIME_ENABLED" \
            --build-arg NEXT_PUBLIC_AI_INTERVIEWER_AVATAR_STREAM_ENABLED="$NEXT_PUBLIC_AI_INTERVIEWER_AVATAR_STREAM_ENABLED" \
            --build-arg NEXT_PUBLIC_OPENAI_REALTIME_STT_RELAY_ENABLED="$NEXT_PUBLIC_OPENAI_REALTIME_STT_RELAY_ENABLED" \
            --build-arg NEXT_PUBLIC_NCS_QUESTION_POLICY_ENABLED="$NEXT_PUBLIC_NCS_QUESTION_POLICY_ENABLED" \
            --build-arg NEXT_PUBLIC_TOSS_CLIENT_KEY="$NEXT_PUBLIC_TOSS_CLIENT_KEY" \
            --build-arg NEXT_PUBLIC_KAKAO_MAP_KEY="${NEXT_PUBLIC_KAKAO_MAP_KEY:-}" \
            -t "${{ steps.aws.outputs.frontend_image }}" .
          docker push "${{ steps.aws.outputs.frontend_image }}"

      - name: Build and push API image
        if: needs.detect.outputs.api == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if aws ecr describe-images --repository-name init-main-api --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "api image $IMAGE_TAG already exists; skipping build and push"
            exit 0
          fi

          docker build -f infra/docker/api.Dockerfile -t "${{ steps.aws.outputs.api_image }}" .
          docker push "${{ steps.aws.outputs.api_image }}"

      - name: Build and push worker image
        if: needs.detect.outputs.worker == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if aws ecr describe-images --repository-name init-main-worker --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "worker image $IMAGE_TAG already exists; skipping build and push"
            exit 0
          fi

          docker build -f infra/docker/worker.Dockerfile -t "${{ steps.aws.outputs.worker_image }}" .
          docker push "${{ steps.aws.outputs.worker_image }}"

      - name: Prepare ECS task definition renderer
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/render-task-definition.py <<'PY'
          import json
          import sys

          source_path, container_name, image, output_path = sys.argv[1:]
          with open(source_path, "r", encoding="utf-8") as source_file:
              source = json.load(source_file)

          task_definition = source.get("taskDefinition", source)
          keep_fields = [
              "family",
              "taskRoleArn",
              "executionRoleArn",
              "networkMode",
              "containerDefinitions",
              "volumes",
              "placementConstraints",
              "requiresCompatibilities",
              "cpu",
              "memory",
              "pidMode",
              "ipcMode",
              "proxyConfiguration",
              "inferenceAccelerators",
              "ephemeralStorage",
              "runtimePlatform",
          ]
          rendered = {
              key: task_definition[key]
              for key in keep_fields
              if key in task_definition and task_definition[key] is not None
          }

          if source.get("tags"):
              rendered["tags"] = source["tags"]

          matched = False
          for container in rendered["containerDefinitions"]:
              if container["name"] == container_name:
                  container["image"] = image
                  matched = True

          if not matched:
              raise SystemExit(f"container {container_name} not found")

          with open(output_path, "w", encoding="utf-8") as output_file:
              json.dump(rendered, output_file)
          PY

      - name: Register frontend task definition
        id: register_frontend
        if: needs.detect.outputs.frontend == 'true'
        shell: bash
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition init-main-frontend \
            --include TAGS \
            --output json > /tmp/frontend-task-definition.json
          python /tmp/render-task-definition.py \
            /tmp/frontend-task-definition.json \
            frontend \
            "${{ steps.aws.outputs.frontend_image }}" \
            /tmp/frontend-rendered-task-definition.json
          task_definition="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/frontend-rendered-task-definition.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)"
          echo "task_definition=$task_definition" >> "$GITHUB_OUTPUT"

      - name: Register API task definition
        id: register_api
        if: needs.detect.outputs.api == 'true'
        shell: bash
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition init-main-api \
            --include TAGS \
            --output json > /tmp/api-task-definition.json
          python /tmp/render-task-definition.py \
            /tmp/api-task-definition.json \
            api \
            "${{ steps.aws.outputs.api_image }}" \
            /tmp/api-rendered-task-definition.json
          task_definition="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/api-rendered-task-definition.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)"
          echo "task_definition=$task_definition" >> "$GITHUB_OUTPUT"

      - name: Verify SMTP from the API task
        if: needs.detect.outputs.api == 'true' && env.SMTP_DEPLOY_SMOKE_ENABLED == 'true'
        shell: bash
        env:
          API_TASK_DEFINITION: ${{ steps.register_api.outputs.task_definition }}
          SMTP_SMOKE_TO: ${{ secrets.SMTP_SMOKE_TO }}
        run: |
          set -euo pipefail

          aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services init-main-api \
            --query 'services[0].networkConfiguration' \
            --output json > /tmp/api-network-configuration.json

          node <<'NODE'
          const fs = require("fs");
          const smokeTo = process.env.SMTP_SMOKE_TO;
          if (!smokeTo) throw new Error("SMTP_SMOKE_TO is required");
          fs.writeFileSync("/tmp/smtp-smoke-overrides.json", JSON.stringify({
            containerOverrides: [{
              name: "api",
              command: ["node", "dist/src/scripts/smtp-smoke.js"],
              environment: [{ name: "SMTP_SMOKE_TO", value: smokeTo }]
            }]
          }));
          NODE

          task_arn="$(aws ecs run-task \
            --cluster "$CLUSTER_NAME" \
            --launch-type FARGATE \
            --task-definition "$API_TASK_DEFINITION" \
            --network-configuration file:///tmp/api-network-configuration.json \
            --overrides file:///tmp/smtp-smoke-overrides.json \
            --query 'tasks[0].taskArn' \
            --output text)"

          if [ -z "$task_arn" ] || [ "$task_arn" = "None" ]; then
            echo "::error::SMTP smoke task was not started."
            exit 1
          fi

          aws ecs wait tasks-stopped --cluster "$CLUSTER_NAME" --tasks "$task_arn"
          exit_code="$(aws ecs describe-tasks \
            --cluster "$CLUSTER_NAME" \
            --tasks "$task_arn" \
            --query "tasks[0].containers[?name=='api'].exitCode | [0]" \
            --output text)"

          echo "SMTP smoke task: $task_arn"
          echo "SMTP smoke exit code: $exit_code"
          if [ "$exit_code" != "0" ]; then
            echo "::error::SMTP smoke failed before API service update."
            exit 1
          fi

      - name: Run database migration
        if: needs.detect.outputs.migration == 'true'
        shell: bash
        env:
          API_TASK_DEFINITION: ${{ steps.register_api.outputs.task_definition }}
        run: |
          set -euo pipefail

          if [ -z "${API_TASK_DEFINITION:-}" ]; then
            echo "::error::API task definition was not registered before migration."
            exit 1
          fi

          aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services init-main-api \
            --query 'services[0].networkConfiguration' \
            --output json > /tmp/api-network-configuration.json

          cat > /tmp/migration-overrides.json <<'JSON'
          {
            "containerOverrides": [
              {
                "name": "api",
                "command": ["npx", "prisma", "migrate", "deploy"]
              }
            ]
          }
          JSON

          task_arn="$(aws ecs run-task \
            --cluster "$CLUSTER_NAME" \
            --launch-type FARGATE \
            --task-definition "$API_TASK_DEFINITION" \
            --network-configuration file:///tmp/api-network-configuration.json \
            --overrides file:///tmp/migration-overrides.json \
            --query 'tasks[0].taskArn' \
            --output text)"

          if [ -z "$task_arn" ] || [ "$task_arn" = "None" ]; then
            echo "::error::ECS migration task was not started."
            exit 1
          fi

          aws ecs wait tasks-stopped --cluster "$CLUSTER_NAME" --tasks "$task_arn"

          exit_code="$(aws ecs describe-tasks \
            --cluster "$CLUSTER_NAME" \
            --tasks "$task_arn" \
            --query "tasks[0].containers[?name=='api'].exitCode | [0]" \
            --output text)"
          reason="$(aws ecs describe-tasks \
            --cluster "$CLUSTER_NAME" \
            --tasks "$task_arn" \
            --query "tasks[0].containers[?name=='api'].reason | [0]" \
            --output text)"

          echo "migration task: $task_arn"
          echo "migration exit code: $exit_code"
          if [ "$reason" != "None" ]; then
            echo "migration reason: $reason"
          fi

          if [ "$exit_code" != "0" ]; then
            echo "::error::Migration failed with exit code $exit_code."
            exit 1
          fi

      - name: Register worker task definition
        id: register_worker
        if: needs.detect.outputs.worker == 'true'
        shell: bash
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition init-main-worker \
            --include TAGS \
            --output json > /tmp/worker-task-definition.json
          python /tmp/render-task-definition.py \
            /tmp/worker-task-definition.json \
            worker \
            "${{ steps.aws.outputs.worker_image }}" \
            /tmp/worker-rendered-task-definition.json
          task_definition="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/worker-rendered-task-definition.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)"
          echo "task_definition=$task_definition" >> "$GITHUB_OUTPUT"

      - name: Update ECS services
        shell: bash
        env:
          FRONTEND_TASK_DEFINITION: ${{ steps.register_frontend.outputs.task_definition }}
          API_TASK_DEFINITION: ${{ steps.register_api.outputs.task_definition }}
          WORKER_TASK_DEFINITION: ${{ steps.register_worker.outputs.task_definition }}
        run: |
          set -euo pipefail

          updated_services=()

          if [ -n "${FRONTEND_TASK_DEFINITION:-}" ]; then
            aws ecs update-service \
              --cluster "$CLUSTER_NAME" \
              --service init-main-frontend \
              --task-definition "$FRONTEND_TASK_DEFINITION" >/dev/null
            updated_services+=(init-main-frontend)
          fi

          if [ -n "${API_TASK_DEFINITION:-}" ]; then
            aws ecs update-service \
              --cluster "$CLUSTER_NAME" \
              --service init-main-api \
              --task-definition "$API_TASK_DEFINITION" >/dev/null
            updated_services+=(init-main-api)
          fi

          if [ -n "${WORKER_TASK_DEFINITION:-}" ]; then
            aws ecs update-service \
              --cluster "$CLUSTER_NAME" \
              --service init-main-worker \
              --task-definition "$WORKER_TASK_DEFINITION" >/dev/null
            updated_services+=(init-main-worker)
          fi

          if [ "${#updated_services[@]}" -eq 0 ]; then
            echo "::error::No ECS service was updated."
            exit 1
          fi

          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "${updated_services[@]}"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location --head "$APP_BASE_URL"
          curl --fail --silent --show-error "$APP_BASE_URL/api/v1/health"

      - name: Show deployed task definitions
        shell: bash
        run: |
          set -euo pipefail

          aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services init-main-frontend init-main-api init-main-worker \
            --query 'services[].{service:serviceName,taskDefinition:taskDefinition,desired:desiredCount,running:runningCount,pending:pendingCount}' \
            --output table
