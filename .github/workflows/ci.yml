name: CI

# 개인 fork용 단순화 CI: 패키지별 install → typecheck → lint → test → build만 실행한다.
# 원본 팀 레포의 역할별 하네스(docs/ownership/role/extended), Docker 빌드, SMTP smoke는 제외했다.

# 구현은 dev에서 진행하고, 완성되면 dev → main PR로 올린다.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-common:
    name: Backend Common
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/common
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/common/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend-api:
    name: Backend API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/api/package-lock.json
            backend/common/package-lock.json
      - name: Build common package
        working-directory: backend/common
        run: |
          npm ci
          npm run build
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend-worker:
    name: Backend Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # frontend test 스크립트가 typecheck를 먼저 실행한다.
      - run: npm test
      - run: npm run build
