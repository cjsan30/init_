# SQS 호환 큐 설정. 값은 infra/aws/s3-sqs.tf 의 AWS 큐 설정과 맞춘다.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

generate-node-address = false

queues {
  init-ai-jobs {
    defaultVisibilityTimeout = 900 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "init-ai-jobs-dlq"
      maxReceiveCount = 3
    }
  }
  init-ai-jobs-dlq {}
}

# 컨테이너를 재시작해도 큐에 남은 작업을 잃지 않도록 디스크에 저장한다.
messages-storage {
  enabled = true
  uri = "jdbc:h2:/data/elasticmq"
}
